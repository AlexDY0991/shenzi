<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>CoolFly Promo</title>
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; src: url('/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 500; src: url('/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; src: url('/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700; src: url('/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 500; src: url('/node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 600; src: url('/node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 700; src: url('/node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2') format('woff2'); }

    html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: Inter, sans-serif; }
    #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    body.preview { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    body.preview #frame { width: min(96vw, 170vh); aspect-ratio: 16 / 9; position: relative; }
    body.preview #stage { position: absolute; left: 0; top: 0; }
    #controls { display: none; gap: 10px; align-items: center; font-size: 14px; }
    body.preview #controls { display: flex; }
    #controls button { background: #FF5A00; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    #controls input[type=range] { width: 50vw; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="frame"><div id="stage"><canvas id="gl"></canvas><canvas id="ui"></canvas></div></div>
  <div id="controls">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.0333" value="0" />
    <span id="time">0.00 s</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
